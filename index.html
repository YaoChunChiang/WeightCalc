<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>槓鈴計算器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>槓鈴計算器</h1>
    <div class="seg" id="unitSeg">
      <button data-unit="kg">kg</button>
      <button data-unit="lb">lb</button>
    </div>
    <button class="icon-btn" id="openInv" aria-label="槓片庫存設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
  </header>

  <section class="total">
    <div class="big"><span id="total">20</span><small id="totalUnit">kg</small></div>
    <div class="sub" id="totalSub"></div>
  </section>

  <section class="stage">
    <svg id="barbell" viewBox="0 0 400 210" aria-label="槓鈴"></svg>
    <div class="chips" id="chips"></div>
  </section>

  <div class="row">
    <span class="label">槓</span>
    <div class="bar-seg" id="barSeg">
      <button data-bar="0"></button>
      <button data-bar="1"></button>
      <label class="custom" id="customWrap">
        <input id="customBar" type="number" inputmode="decimal" min="0" step="0.5" placeholder="自訂">
        <span id="customUnit">kg</span>
      </label>
    </div>
  </div>

  <section class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="manual">手動加片</button>
      <button data-tab="solve">總重回推</button>
    </div>

    <div id="tab-manual">
      <div class="plates" id="plateBtns"></div>
      <div class="actions" style="margin-top:12px">
        <button class="btn" id="undo">↶ 復原</button>
        <button class="btn danger" id="clear">清空</button>
      </div>
    </div>

    <div id="tab-solve" hidden>
      <div class="target">
        <button class="step" id="minus"></button>
        <label class="field">
          <input id="target" type="number" inputmode="decimal" min="0" placeholder="目標總重">
          <span id="targetUnit">kg</span>
        </label>
        <button class="step" id="plus"></button>
      </div>
      <div class="result" id="result" style="margin-top:12px"></div>
      <button class="btn primary" id="apply" style="width:100%;margin-top:12px">放到槓上</button>
    </div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="槓片庫存">
  <div class="grab"></div>
  <h2>槓片庫存</h2>
  <p>以「對」計算（左右各一片 = 1 對）。∞ 表示不限數量。</p>
  <div id="invRows"></div>
  <button class="btn" id="invReset">全部設為不限</button>
  <button class="btn primary" id="closeInv">完成</button>
</div>

<script src="app.js"></script>
</body>
</html>
