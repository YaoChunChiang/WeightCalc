<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>槓鈴計算器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=20261002-0907">
</head>
<body>
<div class="shell">
<main class="app page" id="page-calc">
  <header>
    <h1>槓鈴計算器</h1>
    <div class="seg" id="unitSeg">
      <button data-unit="kg">kg</button>
      <button data-unit="lb">lb</button>
    </div>
    <button class="text-btn" id="openInv">槓片庫存</button>
  </header>

  <section class="total">
    <div class="big"><span id="total">20</span><small id="totalUnit">kg</small></div>
    <div class="sub" id="totalSub"></div>
  </section>

  <section class="stage">
    <svg id="barbell" viewBox="0 0 400 210" aria-label="槓鈴"></svg>
    <div class="chips" id="chips"></div>
  </section>

  <div class="row">
    <span class="label">槓</span>
    <div class="bar-seg" id="barSeg">
      <button data-bar="0"></button>
      <button data-bar="1"></button>
      <label class="custom" id="customWrap">
        <input id="customBar" type="number" inputmode="decimal" min="0" step="0.5" placeholder="自訂">
        <span id="customUnit">kg</span>
      </label>
    </div>
  </div>

  <section class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="solve">總重回推</button>
      <button data-tab="manual">手動加片</button>
    </div>

    <div id="tab-solve">
      <div class="target">
        <button class="step" id="minus"></button>
        <label class="field">
          <input id="target" type="number" inputmode="decimal" min="0" placeholder="目標總重">
          <span id="targetUnit">kg</span>
        </label>
        <button class="step" id="plus"></button>
        <button class="pct-btn" id="pctBtn" hidden>5RM ▾</button>
        <span class="pct-eq" id="pctEq" hidden>=</span>
        <div class="pct-out" id="pctOut" hidden><b id="pctWeight">—</b><small id="pctActual"></small></div>
        <button class="step pct-toggle" id="pctToggle" aria-label="依 RM 計算">RM</button>
      </div>
      <div class="result" id="result"></div>
      <button class="btn primary" id="apply">放到槓上</button>
    </div>

    <div id="tab-manual" hidden>
      <div class="plates" id="plateBtns"></div>
      <div class="actions" style="margin-top:12px">
        <button class="btn" id="undo">↶ 復原</button>
        <button class="btn danger" id="clear">清空</button>
      </div>
    </div>
  </section>
</main>

<main class="app page" id="page-log" hidden>
  <section class="card log-card">
    <div class="log-head">
      <span class="card-title">今日紀錄 <small id="logDate"></small></span>
      <button class="btn small danger" id="logClear">清空</button>
      <button class="btn small" id="logCopy">複製紀錄</button>
    </div>
    <div class="log-list" id="logList"></div>
  </section>

  <section class="card timer" id="timerCard">
    <div class="timer-head">
      <span class="card-title">組間休息</span>
      <label class="check">
        <input type="checkbox" id="timerAuto">
        <span>記錄後自動計時</span>
      </label>
      <div class="seg small" id="timerMode">
        <button data-mode="up">正計時</button>
        <button data-mode="down">倒數</button>
      </div>
    </div>
    <div class="presets" id="presets">
      <button data-s="30">30s</button>
      <button data-s="60">60s</button>
      <button data-s="90">90s</button>
      <button data-s="120">2m</button>
      <button data-s="180">3m</button>
    </div>
    <div class="timer-row">
      <div class="clock-wrap">
        <div class="clock" id="clock">0:00</div>
        <div class="clock-sub" id="clockSub"></div>
      </div>
      <button class="btn primary" id="timerToggle">▶ 開始</button>
      <button class="btn" id="timerReset">重設</button>
    </div>
  </section>

  <section class="card">
    <button class="ex-pick" id="exPick">
      <span class="ex-label">動作</span>
      <span class="ex-name" id="exName">選擇動作</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div class="num-row">
      <span class="num-label">重量</span>
      <button class="num-step" data-field="w" data-d="-1">−</button>
      <label class="num-field">
        <input id="logW" type="number" inputmode="decimal" min="0" placeholder="0">
        <span id="logUnit">kg</span>
      </label>
      <button class="num-step" data-field="w" data-d="1">+</button>
    </div>
    <div class="num-row">
      <span class="num-label">次數</span>
      <button class="num-step" data-field="reps" data-d="-1">−</button>
      <label class="num-field">
        <input id="logReps" type="number" inputmode="numeric" min="1" placeholder="0">
        <span>下</span>
      </label>
      <button class="num-step" data-field="reps" data-d="1">+</button>
    </div>
    <button class="btn primary big" id="logSet">✓ 記錄一組</button>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-page="calc">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h20"/><rect x="5" y="6" width="3" height="12" rx="1"/><rect x="16" y="6" width="3" height="12" rx="1"/></svg>
    <span>計算器</span>
  </button>
  <button data-page="log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg>
    <span>訓練紀錄</span>
    <em class="pill" id="navPill" hidden></em>
  </button>
</nav>

<div class="toast" id="toast"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="槓片庫存">
  <div class="grab"></div>
  <h2>槓片庫存</h2>
  <p>以「對」計算（左右各一片 = 1 對）。∞ 表示不限數量。</p>
  <div id="invRows"></div>
  <button class="btn" id="invReset">全部設為不限</button>
  <button class="btn primary" id="closeInv">完成</button>
</div>

<div class="sheet" id="pctSheet" role="dialog" aria-label="RM">
  <div class="grab"></div>
  <div class="pct-sheet-head"><h2>RM</h2><span id="pctSheetCalc"></span></div>
  <div class="rm-list" id="rmList"></div>
  <button class="btn primary" id="pctDone">完成</button>
</div>

<div class="sheet" id="exSheet" role="dialog" aria-label="選擇動作">
  <div class="grab"></div>
  <h2>選擇動作</h2>
  <div id="exList"></div>
  <div class="ex-add">
    <input id="exNew" type="text" placeholder="新增自訂動作" maxlength="30">
    <button class="btn primary" id="exAdd">新增</button>
  </div>
</div>

</div>

<script src="app.js?v=20261002-0907"></script>
<script src="log.js?v=20261002-0907"></script>
<script src="update.js?v=20261002-0907"></script>
</body>
</html>
